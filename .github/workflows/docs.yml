name: Documentation

# The Sphinx documentation of goldpan and goldsluice (sources in sphinx/, built by tools/build_docs.py into docs/api/).
# A pull request builds it with warnings as errors, so a broken reference or a docstring Sphinx cannot read fails the check.
# A push to develop or master builds it again and commits docs/api/ with the same deploy key as the notes bot
# (RELEASING.md, "The notes bot and the pull-request rule"), so the site, which is served from develop, stays current.

on:
  pull_request:
    paths:
      - "sphinx/**"
      - "python/goldpan/**"
      - "goldsluice/python/**"
      - "tools/build_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [develop, master]
    paths:
      - "sphinx/**"
      - "python/goldpan/**"
      - "goldsluice/python/**"
      - "tools/build_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documentation tools and the packages it documents
        run: |
          python -m pip install -r sphinx/requirements.txt
          python -m pip install -e "./python[archive,parquet,root,midas]"
      - name: Build (warnings are errors)
        run: python tools/build_docs.py --check

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # develop and master require a pull request; the bot pushes with the deploy key (see the notes workflow).
          ssh-key: ${{ secrets.NOTES_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documentation tools and the packages it documents
        run: |
          python -m pip install -r sphinx/requirements.txt
          python -m pip install -e "./python[archive,parquet,root,midas]"
      - name: Build into docs/api/
        run: python tools/build_docs.py --strict
      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish the documentation (generated by tools/build_docs.py)"
            # the branch may have moved while this build ran: rebase onto it, then push
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push || {
              echo "::error::The push was rejected: the docs bot needs the deploy key (secret NOTES_DEPLOY_KEY) and 'Deploy keys' on the bypass list of the rulesets protect-develop and protect-master."
              exit 1
            }
          fi
