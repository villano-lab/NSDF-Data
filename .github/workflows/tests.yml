name: Repository tests

# Runs the repository tests in tests/ (the tools, the notes, the registry data and the guides) on Windows, macOS and Linux, with goldpan
# installed from PyPI as requirements.txt pins it. The library's own tests are in its repository (villano-lab/goldpan).
# check-instructions.yml also runs pytest, as Setup Step 6 of the guides.

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "tools/**"
      - "tests/**"
      - "registry/**"
      - "docs/students/src/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [develop, main]
    paths:
      - "requirements.txt"
      - "tools/**"
      - "tests/**"
      - "registry/**"
      - "docs/students/src/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # keep in step with the Python version in AGENTS.md
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements.txt
        run: python -m pip install -r requirements.txt

      - name: Run the repository tests
        run: python -m pytest tests -q
