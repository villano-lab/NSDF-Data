name: Student notes

on:
  pull_request:
    paths: ["notes/src/**", "tools/build_notes.py"]
  push:
    branches: [master]
    paths: ["notes/src/**", "tools/build_notes.py"]

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate student notes
        run: python tools/build_notes.py check

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build notes into docs/
        run: python tools/build_notes.py build
      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish student notes (generated by tools/build_notes.py)"
            git push
          fi
