# The dataset of r76.dataset.toml, with the detector described in the registry (../../registry) instead of in this file: the readout, the
# channel map and the roles come from the record of "NAI-S2", and root_detector from its `number`. Unlike r76.dataset.toml, which keeps the
# two steps of the guides, this one uses **every algorithm of goldsluice** (python -m goldsluice algorithms): six steps, nine quantities
# for each of the six channels.
# Everything written here wins over the registry, key by key. `python -m goldsluice check r76-registry.dataset.toml` lists the files.

[dataset]
name = "r76-07221203"
output = "~/goldsluice-output/r76-07221203"
metadata = "r76.series.csv"                       # run metadata per series (high voltage, trigger setting), from the run log; its columns are written into the output
registry = ["../../registry"]                  # folders of detector records, relative to this file (goldpan.registry); also GOLDPAN_REGISTRY
# output_format = "root"                       # for ROOT output the zip<N> number is the record's `number`: no root_detector needed

[[sources]]
name = "side2"
format = "idx"
glob = "~/idx/07221203_2025_F*"
detector = "NAI-S2"                            # in the registry: it supplies readout = "DCRC_RUN76" and the idx channels and roles

# Every step names the channels it applies to ("role:phonon": the six sensors) and takes its numbers from the readout with "@readout.<key>",
# so that the window of the baseline is written once (in registry/readouts.toml) and cannot differ between steps.

[[processing]]
algorithm = "peak"                             # adc_max: the largest sample; current_max: the largest sample above the baseline
channels = "role:phonon"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
amps_per_adc = 1.0                             # PLACEHOLDER: current_max is in ADC counts until the ADC-to-amps scale is known

[[processing]]
algorithm = "max_time"                         # max_time_s: when the largest sample happens, in seconds from the start of the trace
channels = "role:phonon"
[processing.params]
sample_period_s = "@readout.sample_period_s"

[[processing]]
algorithm = "baseline"                         # baseline_mean, baseline_std: the mean and the deviation of the pretrigger window (ADC counts)
channels = "role:phonon"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"

[[processing]]
algorithm = "integral"                         # integral: the sum of (x - baseline) over the whole trace, times the sample period (ADC counts x s)
channels = "role:phonon"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"

[[processing]]
algorithm = "excursion"                        # max_deviation: the largest |x - baseline| after the window; excursion_ratio: that over baseline_std
channels = "role:phonon"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"

[[processing]]
algorithm = "rise_time"                        # rise_time_s: from lo to hi of the height of the largest pulse (nan if it has no rise)
channels = "role:phonon"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"
lo = 0.1                                       # the usual 10-90 % rise time: these two are part of the definition of the quantity
hi = 0.9

[[processing]]
algorithm = "rise_crossing"                    # crossing_time_s: when the rise of the largest pulse crosses `fraction` of its height, from the start of the trace
channels = "role:phonon"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"
fraction = 0.2                                 # the 20 % time: the differences of these between channels give the delay-based positions
