[dataset]
name = "r76-82V-window-integral"
output = "~/goldsluice-output/r76-82V-window-integral"
registry = ["C:/Users/Anthony/Research/NSDF-Data/registry"]
metadata = "series.csv"

[[sources]]
name = "raw"
format = "idx"
paths = ["C:/Users/Anthony/idx/07221111_2153_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221112_0943_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221112_2249_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221113_1159_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221114_2141_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221115_0845_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221115_2109_F[0-9][0-9][0-9][0-9]", "C:/Users/Anthony/idx/07221116_1003_F[0-9][0-9][0-9][0-9]"]
detector = "NAI-S2"

[[processing]]
algorithm = "subtract_line"
channels = "role:phonon"
name = "subtract_line1"
[processing.params]
fit_end_samples = 4096
glitch_samples = "@readout.glitch_samples"

[[processing]]
algorithm = "baseline"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"

[[processing]]
algorithm = "excursion"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"

[[processing]]
algorithm = "integral"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"

[[processing]]
algorithm = "peak"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
amps_per_adc = 1
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"

[[processing]]
algorithm = "rise_crossing"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
fraction = 0.2
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"

[[processing]]
algorithm = "max_time"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
sample_period_s = "@readout.sample_period_s"

[[processing]]
algorithm = "rise_time"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
lo = 0.1
hi = 0.9
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"

[[processing]]
algorithm = "window_integral"
channels = "role:phonon"
input = "subtract_line1"
[processing.params]
start_sample = 450
stop_sample = 950
glitch_samples = "@readout.glitch_samples"
pretrigger_samples = "@readout.pretrigger_samples"
sample_period_s = "@readout.sample_period_s"
