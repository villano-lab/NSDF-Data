# The library of NSDF-Data issue 71. Phase 1 made it installable; phase 2 (this layout) puts the code in the package
# `goldpan` and keeps the old flat module names as thin aliases for the existing notebooks (`goldpan.legacy`). Install with
# `python -m pip install -e ./python` from the repository folder (requirements.txt already does: its line
# `-e ./python[archive]`), after which `import goldpan.cuts` (or the old `import pulse_cuts`) works from any folder.
#
# The name `goldpan` is for the analysis half of a planned pair (a future reduction package, `goldsluice`, would produce the
# reduced quantities; this one reads pulses and quantities together and analyses them): see issue 71. It is not tied to this
# repository or to one experiment. The version below is the library's own, not the repository's VERSION; how the two relate
# is still open in issue 71. `check_environment` is included because the first-analysis guide imports it.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldpan"
version = "0.1.0"
description = "Pulse operations, cuts and derived quantities for SuperCDMS-type traces (NSDF-Data)."
requires-python = ">=3.12"
dependencies = ["numpy", "awkward"]

[project.optional-dependencies]
# goldpan.archive writes and reads HDF5 files.
archive = ["h5py"]
# goldpan.adapters.parquet reads and writes the native format.
parquet = ["pyarrow"]
# goldpan.adapters.rq_root reads the RQs in ROOT files.
root = ["uproot"]

[tool.setuptools]
packages = ["goldpan", "goldpan.adapters"]
# The flat names of the first versions, as aliases of the package modules (to be removed in a later release), and the
# environment check, which the first-analysis guide imports.
py-modules = [
    "check_environment",
    "pulse_archive",
    "pulse_channels",
    "pulse_config",
    "pulse_cuts",
    "pulse_io",
    "pulse_operations",
    "pulse_quantities",
    "pulse_status",
]
