name: Note pins

# Every note links to files at an exact commit. This keeps those links honest (issue 51):
#  - check: every pinned link must resolve (the commit and the file exist). This is the check that can fail.
#  - report: which pinned files have changed, moved or been removed since. Shown in the run's summary; it never fails.
#  - a warning when docs/notes/pin-moves.json (what the "latest" links use for moved files) is out of date.
# It runs on every pull request and push, because renaming a file that a note links to is done in a pull request that
# does not touch the notes. It also runs every Monday, so the report stays current.

on:
  pull_request:
  push:
    branches: [develop, master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  pins:
    name: Pinned links in the notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every pinned link resolves
        run: python tools/check_note_pins.py check
      - name: Report (which pinned files changed since) and the moves file
        if: always()
        run: python tools/check_note_pins.py report --check-moves --summary "$GITHUB_STEP_SUMMARY"
