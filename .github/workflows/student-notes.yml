name: Student notes

on:
  pull_request:
    paths: ["notes/src/**", "tools/build_notes.py", "tools/check_note.py", "tools/check_note_numbers.py", "tools/suggest_note_number.py"]
  push:
    # develop is what the site is served from (GitHub Pages), so notes merged there go live.
    # master (releases and hotfixes) is built too, in case a note reaches it first.
    branches: [develop, master]
    paths: ["notes/src/**", "tools/build_notes.py"]

permissions:
  contents: write
  pull-requests: write   # to post the suggested note number on a pull request

concurrency:
  group: student-notes
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the number check reads the notebook at the commit the note links to
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate student notes
        run: python tools/build_notes.py check
      - name: Advice on the numbers of the notes changed in this pull request
        # Advisory: the number check never fails the pull request (it is a help, not a proof). The notes that
        # changed are listed in the job summary and as warnings. Run it yourself first: tools/check_note.py.
        run: python tools/check_note.py --changed "origin/${{ github.base_ref }}" --only numbers --github
      - name: Suggest the note number for a note whose id is still TBD
        # A review comment on the id line with a suggestion block: the reviewer presses Commit suggestion, then merges.
        # Nothing is pushed to the student's branch. Only for branches of this repository: the token of a pull
        # request from a fork cannot write.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/suggest_note_number.py --repo "${{ github.repository }}" --pr ${{ github.event.pull_request.number }} --head "${{ github.event.pull_request.head.sha }}" --base "origin/${{ github.base_ref }}"

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the dates a note became Complete come from Git's history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build notes into docs/
        run: python tools/build_notes.py build
      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Publish student notes (generated by tools/build_notes.py)"
            # the branch may have moved while this build ran: rebase onto it, then push
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
