name: Library tests

# Runs the tests of the shared library in python/ on its own, on Windows, macOS and Linux, so a broken
# function is caught by a check named after the library and not only inside the student-guide walkthrough
# (check-instructions.yml also runs pytest, as Setup Step 6 of the guides). Installs from requirements.txt,
# the single list of packages and versions.

on:
  pull_request:
    paths:
      - "python/**"
      - "requirements.txt"
      - "tools/build_library_reference.py"
      - "docs/library/**"
      - ".github/workflows/library-tests.yml"
  push:
    branches: [develop, master]
    paths:
      - "python/**"
      - "requirements.txt"
      - "tools/build_library_reference.py"
      - "docs/library/**"
      - ".github/workflows/library-tests.yml"
  workflow_dispatch:

concurrency:
  group: library-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # keep in step with the Python version in AGENTS.md
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements.txt
        run: python -m pip install -r requirements.txt

      - name: Run the library tests
        working-directory: python
        run: python -m pytest -q
