name: Check instructions

# Repeats what the student guides tell a student to do, on Windows, macOS and Linux, so a guide
# that stops working is caught here and not by a student. Keep the commands below in step with
# docs/students/src/gen.py (setup Steps 3-7, first-analysis Steps 2-6). Setup Step 5 installs from requirements.txt.

on:
  pull_request:
    paths:
      - "docs/students/**"
      - "docs/developers/**"
      - "docs/index.html"
      - "docs/guide.css"
      - "docs/guide.js"
      - "python/**"
      - "requirements.txt"
      - ".devcontainer/**"
      - ".github/workflows/check-instructions.yml"
      - ".github/scripts/**"
  push:
    branches: [develop, master]
    paths:
      - "docs/students/**"
      - "docs/developers/**"
      - "docs/index.html"
      - "docs/guide.css"
      - "docs/guide.js"
      - "python/**"
      - "requirements.txt"
      - ".devcontainer/**"
      - ".github/workflows/check-instructions.yml"
      - ".github/scripts/**"
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1" # weekly: installer links and package releases change

concurrency:
  group: check-instructions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consistency:
    name: Pins and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analysis files live in data_analysis/
        run: |
          stray=$(git ls-files '*.ipynb' | grep -v '^data_analysis/' || true)
          if [ -n "$stray" ]; then
            echo "Notebooks must live under data_analysis/ (see data_analysis/README.md). Found:"
            echo "$stray"
            exit 1
          fi
          echo "all $(git ls-files '*.ipynb' | wc -l) notebooks are under data_analysis/"

      - name: requirements.txt is installable and used by the setup guide and dev container
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          req = pathlib.Path("requirements.txt").read_text().splitlines()
          names = [l.split("#")[0].strip() for l in req if l.split("#")[0].strip()]
          problems = []
          # pip cannot install a "python==..." line, so the Python version lives in the guide, not here
          problems += [f"requirements.txt line is not installable by pip: {n}" for n in names if n.lower().startswith("python")]
          guide = pathlib.Path("docs/students/src/setup-linux.md").read_text(encoding="utf-8")
          dev = pathlib.Path(".devcontainer/devcontainer.json").read_text()
          if "pip install -r requirements.txt" not in guide:
              problems.append("the setup guide does not install from requirements.txt")
          if "python=3.10" not in guide:
              problems.append("the setup guide does not create the environment with python=3.10")
          if "-r requirements.txt" not in dev:
              problems.append("the dev container does not install from requirements.txt")
          for p in problems:
              print(p)
          print(f"requirements.txt has {len(names)} packages")
          sys.exit(1 if problems else 0)
          EOF

      - name: PDFs copy as plain text (no look-alike hyphens)
        run: |
          python3 -m pip install --quiet pymupdf
          python3 - <<'EOF'
          import glob, sys, pymupdf
          LOOKALIKES = {"\u2010": "U+2010 hyphen", "\u2011": "U+2011 non-breaking hyphen", "\u2212": "U+2212 minus"}
          failed = False
          pdfs = sorted(glob.glob("docs/**/*.pdf", recursive=True))
          for f in pdfs:
              text = "".join(p.get_text() for p in pymupdf.open(f))
              for ch, name in LOOKALIKES.items():
                  if ch in text:
                      print(f"{f}: {text.count(ch)} x {name}. A student who copies a command from this PDF gets a command that fails. "
                            "Rebuild with a monospace font whose hyphen copies as '-' (Latin Modern Mono on Windows; never Consolas).")
                      failed = True
          print(f"checked {len(pdfs)} PDFs")
          sys.exit(1 if failed else 0)
          EOF

      - name: Guides are web pages with a PDF backup, and the front page links to the pages
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys
          problems = []
          pages = sorted(glob.glob("docs/students/*.html") + glob.glob("docs/developers/*.html"))
          for page in pages:
              html = open(page, encoding="utf-8").read()
              name = os.path.basename(page)[:-5]
              if not os.path.exists(page[:-5] + ".pdf"):
                  problems.append(f"{page}: no PDF backup next to it")
              if f'href="{name}.pdf"' not in html:
                  problems.append(f"{page}: does not link to its PDF")
              if "guide.js" not in html or "guide.css" not in html:
                  problems.append(f"{page}: missing the copy-button script or the stylesheet")
              for ch in "\u2010\u2011\u2212":
                  if ch in html:
                      problems.append(f"{page}: contains the look-alike character U+{ord(ch):04X}")
              for img in re.findall(r'<img src="([^"]+)"', html):
                  if not os.path.exists(os.path.join(os.path.dirname(page), img)):
                      problems.append(f"{page}: missing image {img}")
          index = open("docs/index.html", encoding="utf-8").read()
          for link in re.findall(r'href="((?:students|developers)/[^"#]+)"', index):
              if link.endswith(".pdf"):
                  problems.append(f"docs/index.html links straight to a PDF: {link} (link the page; the PDF is linked inside it)")
              if not os.path.exists(os.path.join("docs", link)):
                  problems.append(f"docs/index.html links to a missing file: {link}")
          print(f"checked {len(pages)} guide pages")
          for p in problems:
              print(p)
          sys.exit(1 if problems else 0)
          EOF

      - name: AI agent page, brief and llms.txt are in place and their links work
        run: |
          python3 - <<'EOF'
          import os, re, socket, sys, urllib.error, urllib.request
          problems = []
          for f in ("docs/agents.html", "docs/agent-brief.txt", "docs/llms.txt", "GEMINI.md"):
              if not os.path.exists(f):
                  problems.append(f"missing {f}")
          if not problems:
              page = open("docs/agents.html", encoding="utf-8").read()
              index = open("docs/index.html", encoding="utf-8").read()
              if 'href="agents.html"' not in index:
                  problems.append("the front page does not link to agents.html")
              for f in ("docs/agents.html", "docs/agent-brief.txt", "docs/llms.txt"):
                  text = open(f, encoding="utf-8").read()
                  for ch in "\u2010\u2011\u2212":
                      if ch in text:
                          problems.append(f"{f} contains the look-alike character U+{ord(ch):04X}")
              css = open("docs/style.css", encoding="utf-8").read()
              for icon in re.findall(r'url\((img/agents/[^)]+)\)', css):
                  if not os.path.exists(os.path.join("docs", icon)):
                      problems.append(f"docs/style.css uses a missing icon: {icon}")
              for link in re.findall(r'href="((?!https?:|#|mailto:)[^"]+)"', page):
                  if not os.path.exists(os.path.join("docs", link.split("#")[0])):
                      problems.append(f"docs/agents.html links to a missing file: {link}")
              # the sites behind the buttons must still exist (any HTTP answer counts: some refuse scripts)
              origins = sorted({m.group(1) for m in re.finditer(r'href="(https://(?:chatgpt\.com|claude\.ai|gemini\.google\.com|copilot\.microsoft\.com|www\.perplexity\.ai|codespaces\.new))', page)})
              if len(origins) != 6:
                  problems.append(f"expected 6 assistant and Codespaces sites on the page, found {len(origins)}")
              for o in origins:
                  try:
                      urllib.request.urlopen(urllib.request.Request(o + "/", headers={"User-Agent": "Mozilla/5.0"}), timeout=20)
                      print("answers:", o)
                  except urllib.error.HTTPError as e:
                      print(f"answers ({e.code}):", o)
                  except urllib.error.URLError as e:
                      if isinstance(e.reason, socket.gaierror):
                          problems.append(f"{o} does not resolve")
                      else:
                          print("no answer, not failing:", o, e.reason)
                  except Exception as e:
                      print("no answer, not failing:", o, e)
          for p in problems:
              print(p)
          sys.exit(1 if problems else 0)
          EOF

      - name: Installer and download links in the guides still work
        run: |
          urls=$(grep -ohE 'https://(github\.com/conda-forge/miniforge/releases/latest/download|git-scm\.com/download)/[^ )>"`]*' docs/students/src/*.md | sort -u)
          test -n "$urls"
          fail=0
          for u in $urls; do
            code=$(curl -s -o /dev/null -L -I -w '%{http_code}' "$u" || true)
            echo "$code $u"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

  installers:
    name: Miniforge installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            file: Miniforge3-Linux-x86_64.sh
          - os: macos-latest
            file: Miniforge3-MacOSX-arm64.sh
          - os: windows-latest
            file: Miniforge3-Windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the installer the guide links to
        shell: bash
        run: curl -fL -o "$RUNNER_TEMP/${{ matrix.file }}" "https://github.com/conda-forge/miniforge/releases/latest/download/${{ matrix.file }}"

      - name: Install it (macOS and Linux, batch mode)
        if: runner.os != 'Windows'
        shell: bash
        run: bash "$RUNNER_TEMP/${{ matrix.file }}" -b -p "$RUNNER_TEMP/miniforge3"

      - name: Install it (Windows, with the guide's choices - Just Me, no PATH, no default Python)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "${{ matrix.file }}"
          $p = Start-Process -FilePath $installer -ArgumentList '/InstallationType=JustMe','/AddToPath=0','/RegisterPython=0','/S',"/D=$env:RUNNER_TEMP\miniforge3" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }

      - name: conda runs
        shell: bash
        run: |
          T="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            T=$(cygpath -u "$RUNNER_TEMP")
            "$T/miniforge3/Scripts/conda.exe" --version
          else
            "$T/miniforge3/bin/conda" --version
          fi

  guide-steps:
    name: Guide steps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      # The checkout is this commit's code, which the steps below test. The `git clone`
      # step repeats the guide's own command (it clones master).
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false

      - name: Setup Step 3 - conda is installed
        run: conda --version

      - name: Setup Step 4 - download the code
        run: |
          mkdir -p ~/Research
          cd ~/Research
          git clone https://github.com/villano-lab/NSDF-Data.git
          cd NSDF-Data
          ls

      - name: Setup Step 5 - create the environment
        run: |
          conda create -n darkmatter_cli_env python=3.10 pip -y
          conda activate darkmatter_cli_env
          cd ~/Research/NSDF-Data
          # Step 4's git clone fetched the default branch. Use this commit's requirements.txt, so a
          # pull request tests its own version of the file (the same file once it is merged).
          cp "$GITHUB_WORKSPACE/requirements.txt" requirements.txt
          python -m pip install -r requirements.txt

      - name: Setup Step 6 - tests and tool versions
        run: |
          conda activate darkmatter_cli_env
          cd python
          python -m pytest -q
          nsdf-cli version
          jupyter lab --version

      - name: Setup Step 7 - register the Jupyter kernel
        run: |
          conda activate darkmatter_cli_env
          python -m ipykernel install --user --name darkmatter_cli_env

      - name: Setup Step 8 - install the GitHub helper (gh) used to sign in
        run: |
          conda activate darkmatter_cli_env
          conda install gh -c conda-forge -y
          gh --version
          gh auth login --help > /dev/null

      - name: Setup Step 8 - create a personal branch
        run: |
          cd ~/Research/NSDF-Data
          git config user.name "Your Name"
          git config user.email "you@example.com"
          git checkout -b student-yourname

      - name: First analysis Step 2 - download the data, from the home folder
        run: |
          conda activate darkmatter_cli_env
          cd ~
          nsdf-cli download 07221203_2025_F0001
          ls idx

      - name: First analysis Steps 4-6 - run the guide's own code
        env:
          MPLBACKEND: Agg
        run: |
          conda activate darkmatter_cli_env
          cd data_analysis/R76/notebooks
          python ../../../.github/scripts/run_guide_code.py ../../../docs/students/src/first-analysis-linux.md
