<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="740" viewBox="0 0 680 370">
<title>TES bias circuit coupled to a SQUID readout</title>
<desc>A bias current source Ib feeds current down through two parallel branches to ground: a shunt resistor Rsh, and a branch of the TES, the parasitic resistance Rpar and the input inductor Li. Li is coupled by mutual inductance M to a SQUID ring with two Josephson junctions, biased by Isq. The SQUID voltage goes to an amplifier whose output Vout returns through a feedback resistor Rfb to a feedback coil Lf coupled to the SQUID by Mf.</desc>
