name: Publish goldpan

# Publishes the library in python/ to PyPI as `goldpan`, when a tag `goldpan-vX.Y.Z` is pushed (RELEASING.md, "Publishing the
# library to PyPI"). No token is stored anywhere: PyPI trusts this workflow (a "trusted publisher"), and the upload job waits for
# the maintainer's approval of the `pypi` environment.
#
# Run by hand (Actions, "Run workflow") it only builds and tests the package and never publishes: a dry run.

on:
  push:
    tags: ["goldpan-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # keep in step with the Python version in AGENTS.md

      - name: The tag agrees with the code (tag pushes only)
        if: github.ref_type == 'tag'
        run: |
          python tools/check_goldpan_release.py "$GITHUB_REF_NAME"
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The tag is not on master. Tag the merge commit of the release pull request (RELEASING.md)."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build python --outdir dist
          python -m twine check --strict dist/*

      - name: Install the wheel with its extras in a clean environment and import every module
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          wheel=$(ls dist/*.whl)
          "$RUNNER_TEMP/venv/bin/python" -m pip install "${wheel}[archive,parquet,root,midas]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import importlib, importlib.metadata, pkgutil
          import goldpan
          names = [m.name for m in pkgutil.walk_packages(goldpan.__path__, "goldpan.")]
          for name in names:
              importlib.import_module(name)
          print(f"goldpan {importlib.metadata.version('goldpan')}: imported {len(names)} modules")
          EOF

      - name: The installed version is the tag's (tag pushes only)
        if: github.ref_type == 'tag'
        run: |
          want=$(python tools/check_goldpan_release.py --version-only "$GITHUB_REF_NAME")
          got=$("$RUNNER_TEMP/venv/bin/python" -c "import importlib.metadata as m; print(m.version('goldpan'))")
          test "$want" = "$got" || { echo "::error::The wheel is goldpan $got, the tag is $want"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/goldpan/
    permissions:
      id-token: write # the trusted publisher: PyPI accepts this workflow's identity instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
